<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FreeTranslate Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─────────────────────────────────────────────────────────────────────────────
       FreeTranslate Design System
       Dark glassmorphism theme + Neo-Brutalism light theme
       ───────────────────────────────────────────────────────────────────────────── */
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #080808;
      --bg-glass: rgba(15, 15, 15, 0.95);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 255, 255, 0.12);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-tertiary: rgba(255, 255, 255, 0.5);
      --text-muted: rgba(255, 255, 255, 0.35);
      --accent-white: #ffffff;
      --accent-white-hover: #e8e8e8;
      --danger: #ff4d4d;
      --success: #22c55e;
      --radius-sm: 8px;
      --radius-md: 12px;
      --font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --glass-blur: blur(20px);
      --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-offset: none;
      --border-width: 1px;
    }

    [data-theme="neo-brutalism"] {
      --bg-primary: #ffffff;
      --bg-glass: #ffffff;
      --border-glass: #000000;
      --border-glass-hover: #000000;
      --text-primary: #000000;
      --text-secondary: #333333;
      --text-tertiary: #666666;
      --text-muted: #999999;
      --accent-white: #ffd93d;
      --accent-white-hover: #ffcc00;
      --danger: #ff6b6b;
      --success: #6bcb77;
      --radius-sm: 0px;
      --radius-md: 0px;
      --font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --transition: 0.15s ease;
      --glass-blur: none;
      --shadow-glass: 4px 4px 0px #000000;
      --shadow-offset: 3px 3px 0px #000000;
      --border-width: 3px;
    }

    body {
      width: 320px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 14px;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      padding: 1.25rem;
      background: var(--bg-glass);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--border-width) solid var(--border-glass);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-glass);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1.25rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    h1 span {
      font-size: 1.2rem;
    }

    [data-theme="neo-brutalism"] h1 {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .theme-toggle-btn {
      background: transparent;
      border: var(--border-width) solid var(--border-glass);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      font-size: 1rem;
      transition: all var(--transition);
    }

    .theme-toggle-btn:hover {
      border-color: var(--border-glass-hover);
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    [data-theme="neo-brutalism"] .theme-toggle-btn {
      border: var(--border-width) solid #000000;
      font-weight: 700;
      box-shadow: var(--shadow-offset);
    }

    [data-theme="neo-brutalism"] .theme-toggle-btn:hover {
      background: var(--accent-white);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0px #000000;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      margin-bottom: 0.5rem;
    }

    input[type="text"], 
    select {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 0.875rem;
      padding: 0.6rem 0.8rem;
      outline: none;
      transition: all var(--transition);
    }

    input[type="text"]:focus, 
    select:focus {
      border-color: var(--border-glass-hover);
      background: rgba(255, 255, 255, 0.05);
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    /* Custom Dropdown Styling */
    .custom-select-wrapper {
      position: relative;
    }

    .custom-select-wrapper select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding-right: 2.5rem;
      cursor: pointer;
    }

    .custom-select-wrapper::after {
      content: '';
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--text-tertiary);
      pointer-events: none;
    }

    /* Custom Dropdown Component */
    .custom-dropdown {
      position: relative;
    }

    .dropdown-trigger {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 0.875rem;
      padding: 0.6rem 1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .dropdown-trigger:hover,
    .dropdown-trigger:focus,
    .custom-dropdown:focus-within .dropdown-trigger {
      border-color: var(--border-glass-hover);
      background: rgba(255, 255, 255, 0.05);
      outline: none;
    }

    .dropdown-value {
      flex: 1;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dropdown-arrow {
      flex-shrink: 0;
      transition: transform var(--transition);
      color: var(--text-tertiary);
    }

    .custom-dropdown[aria-expanded="true"] .dropdown-arrow {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all var(--transition);
    }

    .custom-dropdown[aria-expanded="true"] .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      padding: 0.6rem 1rem;
      font-family: var(--font-family);
      font-size: 0.875rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .dropdown-item.selected {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      font-weight: 500;
    }

    .dropdown-item.highlighted {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .server-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-tertiary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-muted);
      transition: background-color var(--transition);
    }

    .status-dot.online {
      background-color: var(--success);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    .status-dot.offline {
      background-color: var(--danger);
    }

    button {
      width: 100%;
      background: var(--accent-white);
      color: #000000;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.7rem 1rem;
      font-family: var(--font-family);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }

    button:hover {
      background: var(--accent-white-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .status-text {
      font-size: 0.75rem;
      margin-top: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      font-weight: 500;
      min-height: 1.2rem;
    }

    .status-text.success {
      color: var(--success);
    }

    .status-text.error {
      color: var(--danger);
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 8l6 6"/>
          <path d="M4 14h6"/>
          <path d="M2 5h12"/>
          <path d="M7 2h1"/>
          <path d="M22 22l-5-10-5 10"/>
          <path d="M14 18h6"/>
        </svg>
        FreeTranslate
      </div>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">🌙</button>
    </h1>
    
    <div class="form-group">
      <label for="api-url">API Server URL</label>
      <div class="custom-select-wrapper">
        <input type="text" id="api-url" placeholder="http://localhost:8000">
      </div>
      <div class="server-status">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-label">Checking server...</span>
      </div>
    </div>

    <div class="form-group">
      <label for="trigger-mode">Trigger Mode</label>
      <div class="custom-dropdown" id="trigger-mode-dropdown" tabindex="0" role="combobox" aria-label="Trigger mode" aria-expanded="false">
        <button class="dropdown-trigger" type="button">
          <span class="dropdown-value">Show 'T' button on highlight</span>
          <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="dropdown-menu" role="listbox">
          <div class="dropdown-item selected" data-value="icon" role="option">Show 'T' button on highlight</div>
          <div class="dropdown-item" data-value="auto" role="option">Translate instantly on highlight</div>
          <div class="dropdown-item" data-value="menu" role="option">Context menu selection only</div>
        </div>
        <input type="hidden" id="trigger-mode" value="icon">
      </div>
    </div>

    <div class="form-group">
      <label for="target-lang">Target Language</label>
      <div class="custom-dropdown" id="target-lang-dropdown" tabindex="0" role="combobox" aria-label="Target language" aria-expanded="false">
        <button class="dropdown-trigger" type="button">
          <span class="dropdown-value">Arabic [arb_Arab]</span>
          <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="dropdown-menu" role="listbox">
          <div class="dropdown-item selected" data-value="arb_Arab" role="option">Arabic [arb_Arab]</div>
          <div class="dropdown-item" data-value="eng_Latn" role="option">English [eng_Latn]</div>
          <div class="dropdown-item" data-value="spa_Latn" role="option">Spanish [spa_Latn]</div>
          <div class="dropdown-item" data-value="fra_Latn" role="option">French [fra_Latn]</div>
          <div class="dropdown-item" data-value="deu_Latn" role="option">German [deu_Latn]</div>
          <div class="dropdown-item" data-value="zho_Hans" role="option">Chinese [zho_Hans]</div>
        </div>
        <input type="hidden" id="target-lang" value="arb_Arab">
      </div>
    </div>

    <button id="save-btn">Save Configuration</button>
    
    <div style="margin-top: 1.5rem; border-top: var(--border-width) solid var(--border-glass); padding-top: 1rem;">
      <label style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 0.5rem; display: block;">Page Translation Settings</label>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;">
        <label style="font-size: 0.875rem; color: var(--text-secondary); font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="enable-full-page" checked style="width: 16px; height: 16px; cursor: pointer;">
          Enable full page translation
        </label>
      </div>
      
      <div style="margin-top: 1rem; border-top: 1px solid var(--border-glass); padding-top: 1rem;">
        <label style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 0.5rem; display: block;">Translate Current Page</label>
        <button id="translate-page-btn" style="margin-top: 0.5rem; background: rgba(255, 255, 255, 0.08); border: var(--border-width) solid var(--border-glass);">Translate Entire Page</button>
      </div>
    </div>
    
    <div id="status-msg" class="status-text"></div>
  </div>

  <script src="dropdown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
